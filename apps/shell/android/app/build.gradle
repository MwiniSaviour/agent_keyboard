apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.agentkeyboard.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.agentkeyboard.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Signed model catalog (SPEC §12.6, ADR-0011). Set in ~/.gradle/gradle.properties or with -P:
        //   ak.modelManifestUrl  = https URL of the signed models.json
        //   ak.modelManifestKeys = keyId:base64Spki[,keyId:base64Spki]  (scripts/models/manifest.mjs keygen)
        // Unset → the Models screen reports "no catalog configured" and nothing is downloaded.
        buildConfigField "String", "MODEL_MANIFEST_URL", "\"${project.findProperty('ak.modelManifestUrl') ?: ''}\""
        buildConfigField "String", "MODEL_MANIFEST_KEYS", "\"${project.findProperty('ak.modelManifestKeys') ?: ''}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    // ADR-0006 / SPEC §17.2: Play builds never perform accessibility actions; `full` (sideload) may.
    // SPEC §17: the `offline` network flavor ships without the INTERNET permission.
    flavorDimensions = ["distribution", "network"]
    productFlavors {
        play {
            dimension "distribution"
            buildConfigField "boolean", "A11Y_ACTIONS", "false"
        }
        full {
            dimension "distribution"
            applicationIdSuffix ".full"
            buildConfigField "boolean", "A11Y_ACTIONS", "true"
        }
        online {
            dimension "network"
            buildConfigField "boolean", "ONLINE", "true"
        }
        offline {
            dimension "network"
            applicationIdSuffix ".offline"
            // No INTERNET permission: models and the signed catalog are imported from files.
            buildConfigField "boolean", "ONLINE", "false"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        // Play's 16 KB page-size requirement (SPEC §12.6): keep native libs uncompressed and aligned.
        jniLibs { useLegacyPackaging = false }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':core')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "net.zetetic:sqlcipher-android:$sqlcipherVersion@aar"
    implementation "androidx.sqlite:sqlite:$androidxSqliteVersion"
    implementation "com.google.ai.edge.litertlm:litertlm-android:$litertlmVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
